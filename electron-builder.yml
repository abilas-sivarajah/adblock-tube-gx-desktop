appId: de.abilas.gxtube.desktop
productName: GX Tube
copyright: GPL-3.0 – nicht mit YouTube oder Google verbunden
artifactName: GXTube-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - "!src/assets/*.svg"
  - package.json
asar: true
publish:
  provider: github
  owner: abilas-sivarajah
  repo: adblock-tube-gx-desktop
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: GXTube-Setup-${version}.${ext}
  shortcutName: GX Tube
portable:
  artifactName: GXTube-${version}-portable.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  syncDesktopName: true
  synopsis: Werbefreier YouTube-Player, steuerbar mit dem Handy
  maintainer: Abilas Sivarajah <abilas-sivarajah@users.noreply.github.com>
appImage:
  artifactName: GXTube-${version}-x86_64.${ext}
deb:
  artifactName: GXTube-${version}-amd64.${ext}

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.video
  identity: null
dmg:
  artifactName: GXTube-${version}-mac.${ext}
